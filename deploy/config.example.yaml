# Cấu hình ag-render-worker cài tay (máy dev, Linux). Máy Windows cài bằng install.ps1 của farm: installer tự viết
# file này và mỗi lần cập nhật viết lại các khoá extra nó quản lý (python_bin, ytdlp_bin, hf_home, encoder, ollama_url,
# unload_ollama_before_tts), giữ các khoá khác.
# Đường dẫn Windows viết trong nháy đơn để khỏi phải escape dấu \.

# URL của ag-farm hub (API, không phải web quản lý)
hub_url: https://farm-api.example.com
# Token node: tạo trên web quản lý ag-farm (trang Máy), chỉ hiện một lần
token: 'DAN_TOKEN_NODE_VAO_DAY'
# Tên hiển thị trên trang Máy
name: gpu-01-render
# Không khai kinds: worker nhận mọi loại job nó có handler và máy chạy được (studio.tts, studio.transcribe cần GPU
# NVIDIA + python_bin import được torch). Khai thì là danh sách ép:
# kinds:
#   - studio.render_preview
#   - studio.render_final
work_dir: 'C:\ag-farm\render\work'
cache:
  dir: 'C:\ag-farm\cache\render'
  max_gb: 100
# Mặc định C:\ProgramData\ag-farm\machine.yaml (dùng chung với ag-scan-worker trên cùng máy)
# machine_file: 'C:\ProgramData\ag-farm\machine.yaml'

# Lịch chạy (bỏ trống = 24/7)
# schedule:
#   - { days: [1, 2, 3, 4, 5], from: '19:00', to: '07:00' }

extra:
  # Python trong venv có torch + OmniVoice + WhisperX (deploy/setup-render.ps1). Máy chỉ nhận studio.tts và
  # studio.transcribe khi chính file này import được torch.
  python_bin: 'C:\ag-farm\venv\Scripts\python.exe'
  # yt-dlp (mặc định: yt-dlp.exe cạnh python_bin, không có thì trên PATH)
  ytdlp_bin: 'C:\ag-farm\venv\Scripts\yt-dlp.exe'
  # Thư mục model Hugging Face (HF_HOME của engine Python)
  hf_home: 'C:\ag-farm\models'
  # Nhận dạng lời nói (studio.transcribe): thiết bị, compute_type, batch_size. GPU 4 GB thì int8_float16 + 4.
  # transcribe_device: auto
  # transcribe_compute_type: float16
  # transcribe_batch_size: 8
  # Máy chạy cả ag-scan-worker: nhả model Ollama khỏi VRAM trước khi TTS
  unload_ollama_before_tts: true
  ollama_url: http://localhost:11434
  # auto = NVENC nếu có, không thì CPU
  encoder: auto
  # Render: số mezzanine dựng cùng lúc (1–8, mặc định 3; mỗi luồng giải mã 4K cần ~1,5 GB RAM) và số file nguồn tải
  # cùng lúc (1–6, mặc định 2). Xem README, mục "Tốc độ render".
  # mezz_concurrency: 3
  # download_concurrency: 2
  # Thư mục chứa arial.ttf (mặc định C:\Windows\Fonts)
  # fonts_dir: 'C:\Windows\Fonts'
